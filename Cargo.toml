[package]
name = "amiable_indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitcoin = "0.32.102"
bitcoincore-rpc = "0.19.0"
bitcoincore-zmq = { version = "1.5.4", features = ["async"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.53.1", features = ["full"] }
