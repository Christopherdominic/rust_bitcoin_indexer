[package]
name = "amiable_indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bitcoin = "0.32.102"
bitcoincore-rpc = "0.19.0"
bitcoincore-zmq = { version = "1.5.4", features = ["async"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
